<!DOCTYPE html>
<html lang="en" data-theme="{{mdprv-theme}}" data-theme-kind="{{mdprv-theme-kind}}" data-scheme="{{mdprv-scheme}}" data-shiki-light="{{mdprv-shiki-light}}" data-shiki-dark="{{mdprv-shiki-dark}}" data-mermaid-light="{{mdprv-mermaid-light}}" data-mermaid-dark="{{mdprv-mermaid-dark}}" data-emoji="{{mdprv-emoji}}" data-icons="{{mdprv-icons}}" data-loader="{{mdprv-loader}}" data-loader-dark="{{mdprv-loader-dark}}" data-zoom-sensitivity="{{mdprv-zoom}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>{{mdprv-title}}</title>
  <style id="mdprv-theme-css">{{mdprv-theme-css}}</style>
  <style id="mdprv-icon-css">{{mdprv-icon-css}}</style>
  <script>
  (function () {
    var root = document.documentElement;
    var LOADERS = ["classic", "dots", "bars", "ring", "pulse", "braille"];
    function local(key) {
      try { return window.localStorage.getItem(key); } catch (error) { return null; }
    }
    function session(key) {
      try { return window.sessionStorage.getItem(key); } catch (error) { return null; }
    }
    function clearSession(key) {
      try { window.sessionStorage.removeItem(key); } catch (error) { /* ignore */ }
    }
    function loaderName(value) {
      return typeof value === "string" && LOADERS.indexOf(value) >= 0 ? value : null;
    }

    // Effective scheme is explicit in the DOM so the Shiki CSS and the modal
    // can key off it, including for fixed themes. A local loader always wins.
    var stored = loaderName(local("mdprv_loader"));
    var lightLoader = loaderName(root.getAttribute("data-loader")) || "classic";
    var darkLoader = loaderName(root.getAttribute("data-loader-dark")) || lightLoader;
    function applyScheme(dark) {
      root.setAttribute("data-scheme", dark ? "dark" : "light");
      if (stored === null) {
        root.setAttribute("data-loader", dark ? darkLoader : lightLoader);
      }
    }
    if (root.getAttribute("data-theme-kind") === "auto" || root.getAttribute("data-theme") === "auto") {
      var darkQuery = null;
      try {
        darkQuery = typeof window.matchMedia === "function"
          ? window.matchMedia("(prefers-color-scheme: dark)")
          : null;
      } catch (error) { darkQuery = null; }
      applyScheme(!!(darkQuery && darkQuery.matches));
      if (darkQuery) {
        var onSchemeChange = function (event) { applyScheme(!!event.matches); };
        if (typeof darkQuery.addEventListener === "function") {
          darkQuery.addEventListener("change", onSchemeChange);
        } else if (typeof darkQuery.addListener === "function") {
          darkQuery.addListener(onSchemeChange);
        }
      }
    }
    if (stored !== null) {
      root.setAttribute("data-loader", stored);
    }

    if (local("mdprv_simple_table") === "1") {
      root.classList.add("mdprv-simple-tables");
    }

    if (local("mdprv_simple_diff") === "1") {
      root.classList.add("mdprv-simple-diffs");
    }

    if (local("mdprv_table_wrap") === "1") {
      root.classList.add("mdprv-wrap-cells");
    }

    var shouldLoad = false;
    var raw = session("mdprv_loader_pending");
    if (raw !== null) {
      clearSession("mdprv_loader_pending");
      if (raw === "1") {
        shouldLoad = true;
      } else {
        try {
          var intent = JSON.parse(raw);
          if (intent && intent.v === 1 && intent.path === location.pathname &&
              typeof intent.ts === "number" && Date.now() - intent.ts <= 15000) {
            shouldLoad = true;
          }
        } catch (error) { /* malformed intent */ }
      }
    }

    if (!shouldLoad) {
      try {
        var entries = performance.getEntriesByType("navigation");
        var navigation = entries && entries[0];
        if (navigation && navigation.type === "reload") {
          shouldLoad = true;
        }
      } catch (error) { /* navigation timing unavailable */ }
    }

    if (shouldLoad) {
      root.setAttribute("data-loading", "1");
    }

    var GENERICS = ["system-ui", "sans-serif", "serif", "monospace", "cursive", "fantasy"];
    function fontFamily(value) {
      if (typeof value !== "string") {
        return null;
      }
      if (/[\u0000-\u001f\u007f;{}<>"'\\]/.test(value)) {
        return null;
      }
      var family = value.replace(/\s+/g, " ").trim();
      if (!family || family.length > 128) {
        return null;
      }
      return family;
    }
    function themeStack() {
      try {
        if (window.getComputedStyle) {
          var value = window.getComputedStyle(root).getPropertyValue("--mdprv-font-stack");
          value = (value || "").trim();
          if (value && value.length <= 512 && !/[\u0000-\u001f\u007f;{}<>\\]/.test(value)) {
            return value;
          }
        }
      } catch (error) { /* theme stack unavailable */ }
      return "system-ui, sans-serif";
    }
    function stackFor(family, stack) {
      if (typeof stack === "string" && stack.length <= 512 && stack.trim() !== "" &&
          !/[\u0000-\u001f\u007f;{}<>\\]/.test(stack)) {
        return stack.trim();
      }
      var base = themeStack();
      if (GENERICS.indexOf(family.toLowerCase()) >= 0) {
        var tokens = [];
        var parts = base.split(",");
        for (var i = 0; i < parts.length; i++) {
          var token = parts[i].trim();
          if (token && token.toLowerCase() !== family.toLowerCase()) {
            tokens.push(token);
          }
        }
        return [family].concat(tokens).join(", ");
      }
      return '"' + family + '", ' + base;
    }
    try {
      var rawFont = local("mdprv_font");
      if (rawFont) {
        var fontFamilyName = null;
        var fontSource = "local";
        var fontStackValue = "";
        var fontText = rawFont.trim();
        if (fontText.charAt(0) === "{") {
          try {
            var fontValue = JSON.parse(fontText);
            if (fontValue && fontValue.v === 1) {
              fontFamilyName = fontFamily(fontValue.family);
              fontSource = fontValue.source === "google" ? "google" : "local";
              fontStackValue = fontValue.stack;
            }
          } catch (error) { /* malformed selection */ }
        } else {
          fontFamilyName = fontFamily(fontText);
        }
        if (fontFamilyName) {
          root.style.setProperty("--mdprv-font", stackFor(fontFamilyName, fontStackValue));
          if (fontSource === "google") {
            var fontLink = document.createElement("link");
            fontLink.id = "mdprv-font-google-css";
            fontLink.rel = "stylesheet";
            fontLink.href = "/__fonts/google?family=" + encodeURIComponent(fontFamilyName);
            fontLink.addEventListener("error", function () {
              root.setAttribute("data-font-missing", "1");
            });
            fontLink.addEventListener("load", function () {
              root.removeAttribute("data-font-missing");
            });
            (document.head || root).appendChild(fontLink);
          }
        }
      }
    } catch (error) { /* font activation must not break boot */ }
  })();
  </script>
</head>
<body>
  <p id="mdprv-status" class="mdprv-sr-only" role="status" aria-live="polite"></p>
  <aside class="mdprv-sidebar" id="mdprv-sidebar">
    <div class="mdprv-sidebar-head">
      <span class="mdprv-sidebar-title">Preview</span>
    </div>
    <nav id="mdprv-toc" class="mdprv-toc" aria-label="Table of contents"></nav>
  </aside>
  <button type="button" id="mdprv-settings-toggle" class="mdprv-settings-toggle" aria-label="Preview settings" aria-haspopup="dialog" aria-controls="mdprv-settings-dialog" aria-expanded="false"><span class="mdprv-icon" data-icon="settings" aria-hidden="true"></span></button>
  <button type="button" id="mdprv-sidebar-toggle" class="mdprv-sidebar-toggle" aria-label="Toggle sidebar" aria-expanded="true"><span class="mdprv-icon" data-icon="sidebar" aria-hidden="true"></span></button>
  <aside class="mdprv-history" id="mdprv-history" aria-label="Recent previews">
    <div class="mdprv-sidebar-head"><span class="mdprv-sidebar-title">Recent</span></div>
    <ul class="mdprv-history-list" id="mdprv-history-list"></ul>
  </aside>
  <button type="button" id="mdprv-history-toggle" class="mdprv-history-toggle" aria-label="Toggle recent previews" aria-expanded="true"><span class="mdprv-icon" data-icon="history" aria-hidden="true"></span></button>
  <div class="mdprv-drag mdprv-drag-left" id="mdprv-drag-left" role="separator" aria-orientation="vertical" aria-label="Resize content width (left)"></div>
  <div class="mdprv-drag mdprv-drag-right" id="mdprv-drag-right" role="separator" aria-orientation="vertical" aria-label="Resize content width (right)"></div>
  <button type="button" id="mdprv-top" class="mdprv-top" aria-label="Back to top"><span class="mdprv-icon" data-icon="top" aria-hidden="true"></span></button>
  <button type="button" id="mdprv-zen-toggle" class="mdprv-zen-toggle" aria-label="Enter zen mode" aria-pressed="false"><span class="mdprv-icon mdprv-icon-enter" data-icon="zen" aria-hidden="true"></span><span class="mdprv-icon mdprv-icon-exit" data-icon="zen-exit" aria-hidden="true"></span></button>
  <div id="mdprv-loader-overlay" class="mdprv-loader-overlay" aria-hidden="true"><div id="mdprv-loader-spinner" class="mdprv-loader mdprv-loader--{{mdprv-loader}}"></div></div>
  <div id="mdprv-mermaid-lightbox" class="mdprv-mermaid-lightbox" role="dialog" aria-modal="true" aria-label="Full screen media" aria-hidden="true"><button type="button" class="mdprv-mermaid-close" aria-label="Close full screen (Esc)"><span class="mdprv-icon" data-icon="close" aria-hidden="true"></span></button><div class="mdprv-mermaid-tools"><button type="button" class="mdprv-mermaid-copy" aria-label="Copy image" title="Copy image"></button><button type="button" class="mdprv-mermaid-out" aria-label="Zoom out">&minus;</button><button type="button" class="mdprv-mermaid-reset" aria-label="Reset zoom">100%</button><button type="button" class="mdprv-mermaid-in" aria-label="Zoom in">+</button></div><div class="mdprv-mermaid-status" role="status" aria-live="polite"></div><div class="mdprv-mermaid-stage" id="mdprv-mermaid-stage"></div></div>
  <div id="mdprv-table-lightbox" class="mdprv-table-lightbox" role="dialog" aria-modal="true" aria-label="Tabela em tela cheia" aria-hidden="true"><button type="button" class="mdprv-table-close" data-lb-close aria-label="Fechar tela cheia (Esc)"><span class="mdprv-icon" data-icon="close" aria-hidden="true"></span></button><div class="mdprv-table-stage" id="mdprv-table-stage"><div class="mdprv-table-frame" id="mdprv-table-frame"><span class="mdprv-table-handle" data-lb-handle="left" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Redimensionar tabela pela borda esquerda"></span><span class="mdprv-table-handle" data-lb-handle="right" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Redimensionar tabela pela borda direita"></span><span class="mdprv-table-handle" data-lb-handle="top" role="separator" aria-orientation="horizontal" tabindex="0" aria-label="Redimensionar tabela pela borda superior"></span><span class="mdprv-table-handle" data-lb-handle="bottom" role="separator" aria-orientation="horizontal" tabindex="0" aria-label="Redimensionar tabela pela borda inferior"></span><span class="mdprv-table-handle" data-lb-handle="nw" role="separator" tabindex="0" aria-label="Redimensionar tabela pelo canto superior esquerdo"></span><span class="mdprv-table-handle" data-lb-handle="ne" role="separator" tabindex="0" aria-label="Redimensionar tabela pelo canto superior direito"></span><span class="mdprv-table-handle" data-lb-handle="sw" role="separator" tabindex="0" aria-label="Redimensionar tabela pelo canto inferior esquerdo"></span><span class="mdprv-table-handle" data-lb-handle="se" role="separator" tabindex="0" aria-label="Redimensionar tabela pelo canto inferior direito"></span></div></div><div class="mdprv-table-lb-tools"><button type="button" data-lb-copy hidden aria-label="Copiar conteúdo da célula" title="Copiar conteúdo da célula">Copiar</button><button type="button" data-lb-zoom-out aria-label="Diminuir zoom">&minus;</button><button type="button" data-lb-zoom-reset aria-label="Restaurar zoom e centralizar">100%</button><button type="button" data-lb-zoom-in aria-label="Aumentar zoom">+</button></div><div class="mdprv-table-lb-status" data-lb-status role="status" aria-live="polite"></div></div>
  <div class="mdprv-view-toolbar" id="mdprv-view-toolbar" role="group" aria-label="Document view">
    <button type="button" id="mdprv-raw-toggle" class="mdprv-view-btn" aria-pressed="false" aria-expanded="false" aria-controls="mdprv-raw">Raw</button>
    <button type="button" id="mdprv-raw-copy" class="mdprv-view-btn mdprv-raw-copy" aria-label="Copy raw Markdown"><span id="mdprv-raw-copy-icon" class="mdprv-raw-copy-icon" aria-hidden="true"></span><span>Copy raw</span></button>
  </div>
  <section id="mdprv-raw" class="mdprv-raw" aria-label="Raw Markdown source" hidden>
    <pre class="mdprv-raw-pre"><code id="mdprv-raw-code" class="mdprv-raw-code"></code></pre>
  </section>
  <article id="mdprv-doc" class="markdown-body" tabindex="-1">{{mdprv-meta}}{{mdprv-body}}</article>
  <section id="mdprv-closed" class="mdprv-closed-state" aria-labelledby="mdprv-closed-title" hidden>
    <h2 id="mdprv-closed-title" tabindex="-1">No document open</h2>
    <p>Run <code>md-preview &lt;file&gt;</code> in a terminal to open a document, or pick one from Recent.</p>
  </section>
  <div id="mdprv-settings-root"></div>
  <script type="application/json" id="mdprv-data">{{mdprv-data}}</script>
  <script src="/__assets/mermaid.min.js"></script>
  <script type="module" src="./main.ts"></script>
</body>
</html>
